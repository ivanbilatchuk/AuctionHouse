# Стек розробки. Секрети задаються командами (значення шифруються Pulumi, у репозиторій не потрапляють у відкритому вигляді):
#   pulumi config set --secret keycloak:password <пароль адміністратора Keycloak = параметр keycloak-admin-password AppHost>
#   pulumi config set --secret testUserPassword <тимчасовий пароль тестових користувачів>
